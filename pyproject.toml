[build-system]
requires = ["hatchling>=1.21", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "pyena"
dynamic = ["version"]
description = "Python implementation of rENA-exact Epistemic Network Analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "JongHwi Song", email = "zhegllyang@gmail.com" },
]
maintainers = [
    { name = "JongHwi Song", email = "zhegllyang@gmail.com" },
]
keywords = [
    "epistemic-network-analysis",
    "ena",
    "rena",
    "discourse-analysis",
    "text-mining",
    "reproducibility",
    "llm-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "ipykernel",
]
validate = [
    "rpy2>=3.5",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/zhegllyang/pyena"
Repository = "https://github.com/zhegllyang/pyena"
Issues = "https://github.com/zhegllyang/pyena/issues"
Changelog = "https://github.com/zhegllyang/pyena/blob/main/CHANGELOG.md"

# ---------- hatch / versioning ----------
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/pyena/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyena"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pyena",
    "tests",
    "README.md",
    "LICENSE",
    "CITATION.cff",
    "CHANGELOG.md",
    "pyproject.toml",
]

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with -m \"not slow\")",
    "rpy2: requires R and rpy2 (deselect with -m \"not rpy2\")",
]

[tool.coverage.run]
source = ["pyena"]
branch = true

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["N803", "N806"]  # ML conventions: X, U, S, Vt

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/pyena/_version.py" = ["ALL"]
